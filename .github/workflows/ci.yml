name: Full-stack tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Backend unit, HTTP and database integration tests
        run: ./mvnw --batch-mode test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend type check, build, lint and unit tests
        working-directory: frontend
        run: |
          npm run build
          npm run lint
          npm run test

      - name: Install headless Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium --only-shell

      - name: Browser E2E tests against Spring Boot + PostgreSQL
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop demo database
        if: always()
        run: docker compose down
